name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies (if package.json exists)
        run: |
          if [ -f package.json ]; then npm install; fi
          npm install --no-save typescript

      - name: Sync Capacitor (if applicable)
        run: |
          if [ -f package.json ]; then npx cap sync android; fi

      - name: Force-copy www into Android assets (safety net)
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Show Java version being used
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
